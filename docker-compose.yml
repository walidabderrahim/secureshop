version: '3.8'
services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - inventory-service
    networks:
      - secureshop-net

  user-service:
    build: ./services/user-service
    expose:
      - "8001"
    environment:
      - JWT_SECRET=changeme_in_production
      - DB_URL=sqlite:///users.db
    networks:
      - secureshop-net

  product-service:
    build: ./services/product-service
    expose:
      - "8002"
    environment:
      - DB_URL=sqlite:///products.db
    networks:
      - secureshop-net

  order-service:
    build: ./services/order-service
    expose:
      - "8003"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - PRODUCT_SERVICE_URL=http://product-service:8002
    networks:
      - secureshop-net

  payment-service:
    build: ./services/payment-service
    expose:
      - "8004"
    environment:
      - ORDER_SERVICE_URL=http://order-service:8003
    networks:
      - secureshop-net

  notification-service:
    build: ./services/notification-service
    expose:
      - "8005"
    environment:
      - SMTP_HOST=smtp.example.com
      - SMTP_USER=user@example.com
      - SMTP_PASS=changeme_in_production
    networks:
      - secureshop-net

  inventory-service:
    build: ./services/inventory-service
    expose:
      - "8006"
    environment:
      - DB_URL=sqlite:///inventory.db
    networks:
      - secureshop-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    expose:
      - "5672"
    networks:
      - secureshop-net

networks:
  secureshop-net:
    driver: bridge
