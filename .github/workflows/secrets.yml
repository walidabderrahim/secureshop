name: Step 4 — Secrets Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1 : Gitleaks — scan de l'historique Git
  # ──────────────────────────────────────────────
  gitleaks:
    name: Gitleaks — Git History Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet obligatoire pour Gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --report-format sarif --report-path gitleaks-report.sarif --exit-code 0

      - name: Upload Gitleaks SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks

      - name: Upload Gitleaks report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif

  # ──────────────────────────────────────────────
  # JOB 2 : TruffleHog — entropie + patterns
  # ──────────────────────────────────────────────
  trufflehog:
    name: TruffleHog — Entropy + Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true   # ne bloque pas le pipeline si finding

      - name: TruffleHog JSON report
        run: |
          pip install trufflehog3 --quiet
          trufflehog3 --format json --output trufflehog-report.json . || true

      - name: Upload TruffleHog report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog-report.json
