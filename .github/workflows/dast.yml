name: Step 6 — DAST (OWASP ZAP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1 : Démarrer l'application + lancer ZAP Baseline Scan
  # ──────────────────────────────────────────────────────────────
  dast-zap:
    name: OWASP ZAP — Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Démarrer tous les services avec Docker Compose ──
      - name: Start SecureShop via Docker Compose
        run: |
          docker compose up -d --build
          echo "Attente démarrage des services (30s)..."
          sleep 30

      - name: Vérifier que les services sont up
        run: |
          curl -f http://localhost/api/users/health     || echo "user-service KO"
          curl -f http://localhost/api/products/health  || echo "product-service KO"
          curl -f http://localhost/api/orders/health    || echo "order-service KO"
          curl -f http://localhost/api/payments/health  || echo "payment-service KO"
          curl -f http://localhost/api/notifications/health || echo "notification-service KO"
          curl -f http://localhost/api/inventory/health || echo "inventory-service KO"

      # ── 2. ZAP Baseline Scan — API Gateway (port 80) ──
      - name: ZAP Baseline Scan — API Gateway
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost'
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a -j'    # -a : ajaxSpider, -j : JSON report
          allow_issue_writing: false
          fail_action: false      # ne bloque pas le pipeline (rapport uniquement)

      # ── 3. ZAP API Scan sur les endpoints principaux ──
      - name: ZAP API Scan — user-service
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost/api/users'
          format: openapi
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
        continue-on-error: true

      - name: ZAP API Scan — product-service
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost/api/products'
          format: openapi
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
        continue-on-error: true

      - name: ZAP API Scan — order-service
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost/api/orders'
          format: openapi
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
        continue-on-error: true

      # ── 4. Upload des rapports ──
      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Upload ZAP SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: report_sarif.sarif
          category: owasp-zap
        continue-on-error: true

      # ── 5. Arrêt des services ──
      - name: Stop Docker Compose
        if: always()
        run: docker compose down
