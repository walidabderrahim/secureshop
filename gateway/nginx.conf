events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

  upstream user_service         { server user-service:8001; }
  upstream product_service      { server product-service:8002; }
  upstream order_service        { server order-service:8003; }
  upstream payment_service      { server payment-service:8004; }
  upstream notification_service { server notification-service:8005; }
  upstream inventory_service    { server inventory-service:8006; }

  server {
    listen 80;
    limit_req zone=api burst=20 nodelay;

    # ── Security Headers ──────────────────────────────────────
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    # ──────────────────────────────────────────────────────────

    location /api/users/ {
      proxy_pass http://user_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/products/ {
      proxy_pass http://product_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/orders/ {
      proxy_pass http://order_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/payments/ {
      proxy_pass http://payment_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/notifications/ {
      proxy_pass http://notification_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/inventory/ {
      proxy_pass http://inventory_service/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}